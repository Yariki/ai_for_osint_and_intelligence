# Network Discovery Map: the Compose stack.
#
#   cp .env.example .env     (and replace the placeholders)
#   docker compose up -d --build
#
# or, with the release images already built (deploy/release/build-images.sh):
#   docker compose up -d
#
# Only the proxy publishes a port to the outside (443). PostgreSQL and the API
# are on an internal network that has no route to or from the outside. The
# orchestrator is on it too, and has a second network for outgoing connections
# only: it downloads the reference datasets and asks the resolver for names.
# RabbitMQ is published on the host's loopback address only, for the scanner,
# which runs on the host network.
# Secrets come from the environment (.env) at run time. None is a build
# argument, and none is copied into an image.

name: ndm

# The release of the project's own images (deploy/release/VERSIONS.md). Every
# image below has an exact version: the project's own the release tag, built
# by deploy/release/build-images.sh or by "docker compose build"; third-party
# images a pinned version. Set NDM_VERSION in .env only to run another release.
x-version-args: &version-args
  NDM_VERSION: ${NDM_VERSION:-1.0.0-rc.1}
  NDM_REVISION: ${NDM_REVISION:-unknown}

# Settings the api, the orchestrator and the scanner each read from their own
# environment. The scope rules are enforced three times; each process needs
# its own copy of what they depend on.
x-scan-settings: &scan-settings
  NDM_NEVER_SCAN: ${NDM_NEVER_SCAN:-}
  NDM_ALLOW_NON_PUBLIC_TARGETS: ${NDM_ALLOW_NON_PUBLIC_TARGETS:-false}
  NDM_GLOBAL_RATE_PPS: ${NDM_GLOBAL_RATE_PPS:-5000}
  NDM_MAX_CONCURRENT_SCANS: ${NDM_MAX_CONCURRENT_SCANS:-3}
  NDM_MAX_CONCURRENT_TRACEROUTES: ${NDM_MAX_CONCURRENT_TRACEROUTES:-5}
  NDM_MIN_SCHEDULE_INTERVAL_SECONDS: ${NDM_MIN_SCHEDULE_INTERVAL_SECONDS:-3600}
  NDM_VANTAGE_POINT: ${NDM_VANTAGE_POINT:-default}
  NDM_LOG_LEVEL: ${NDM_LOG_LEVEL:-INFO}

# Settings shared by every service: no privilege escalation, no capabilities.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  proxy:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/Dockerfile.proxy
      args: *version-args
    image: ndm-proxy:${NDM_VERSION:-1.0.0-rc.1}
    environment:
      NDM_SITE_ADDRESS: ${NDM_SITE_ADDRESS:-localhost}
    ports:
      - "443:8443"
    networks:
      - edge
      - internal
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    volumes:
      # The internal CA and its certificates. Keep this volume: a new CA means
      # that every browser has to trust a new root certificate.
      - caddy-state:/var/lib/caddy
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/proxy-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: 1.0

  api:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args: *version-args
    image: ndm-backend:${NDM_VERSION:-1.0.0-rc.1}
    environment:
      # The application role: it cannot change the audit log.
      NDM_DATABASE_URL: postgresql+asyncpg://${NDM_DB_APP_ROLE:-ndm_app}:${NDM_DB_APP_PASSWORD:?set NDM_DB_APP_PASSWORD in .env}@postgres:5432/ndm
      NDM_BROKER_URL: amqp://ndm:${NDM_BROKER_PASSWORD:?set NDM_BROKER_PASSWORD in .env}@rabbitmq:5672/
      NDM_SESSION_IDLE_TIMEOUT_SECONDS: ${NDM_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      NDM_PROJECT_SCOPE_CEILING: ${NDM_PROJECT_SCOPE_CEILING:-65536}
      # The map's tile source. There is no default: without it the map shows a
      # notice and contacts no tile server.
      NDM_TILE_URL_TEMPLATE: ${NDM_TILE_URL_TEMPLATE:-}
      NDM_TILE_ATTRIBUTION: ${NDM_TILE_ATTRIBUTION:-}
      <<: *scan-settings
    networks:
      - internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

  # Owns every scan from queue to completion. Sends no probe and serves no
  # HTTP to the browser; its metrics and health check stay on the internal network.
  # It is the only service with the reference-data volume and the MaxMind key,
  # and the only one on the internal network that can open outgoing connections.
  orchestrator:
    <<: *hardening
    image: ndm-backend:${NDM_VERSION:-1.0.0-rc.1}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args: *version-args
    command: ["python", "-m", "ndm.orchestrator.main"]
    environment:
      NDM_DATABASE_URL: postgresql+asyncpg://${NDM_DB_APP_ROLE:-ndm_app}:${NDM_DB_APP_PASSWORD:?set NDM_DB_APP_PASSWORD in .env}@postgres:5432/ndm
      NDM_BROKER_URL: amqp://ndm:${NDM_BROKER_PASSWORD:?set NDM_BROKER_PASSWORD in .env}@rabbitmq:5672/
      # Reference datasets. All optional: without them a scan still completes,
      # and the fields they would fill are marked unavailable.
      NDM_MAXMIND_ACCOUNT_ID: ${NDM_MAXMIND_ACCOUNT_ID:-}
      NDM_MAXMIND_LICENSE_KEY: ${NDM_MAXMIND_LICENSE_KEY:-}
      NDM_GEOLITE_UPDATE_INTERVAL_HOURS: ${NDM_GEOLITE_UPDATE_INTERVAL_HOURS:-24}
      NDM_RIR_UPDATE_INTERVAL_HOURS: ${NDM_RIR_UPDATE_INTERVAL_HOURS:-168}
      NDM_RIR_OBJECT_REGISTRIES: ${NDM_RIR_OBJECT_REGISTRIES:-}
      NDM_RIR_FILES_PATH: /var/lib/ndm/registry-files
      # Reverse DNS sends the addresses of discovered hosts to this resolver.
      NDM_PTR_ENABLED: ${NDM_PTR_ENABLED:-true}
      NDM_PTR_RESOLVER: ${NDM_PTR_RESOLVER:-}
      # Below this confidence a host's device type is "unknown".
      NDM_CLASSIFICATION_THRESHOLD: ${NDM_CLASSIFICATION_THRESHOLD:-0.5}
      <<: *scan-settings
    networks:
      - internal
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    # Python as process 1 ignores SIGTERM, so "docker compose stop" would wait
    # ten seconds and then kill it. Docker's init passes SIGTERM on, and the
    # process ends at once; recovery handles that like any other stop.
    init: true
    read_only: true
    volumes:
      # Downloaded datasets. No other service mounts this volume.
      - reference-data:/var/lib/ndm/reference
      # Bulk files of ARIN and LACNIC that the operator obtained and put here.
      - ${NDM_RIR_FILES_DIR:-./registry-files}:/var/lib/ndm/registry-files:ro
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0

  # The only component that touches targets. It runs on the host network, so
  # that it sends from the host's own address with no NAT in between
  # (architecture section 8.5), as a non-root user with one capability.
  scanner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.scanner
      args: *version-args
    image: ndm-scanner:${NDM_VERSION:-1.0.0-rc.1}
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    # Deliberately no "no-new-privileges" here: it would switch off the file
    # capability that gives the non-root process its one capability.
    environment:
      # RabbitMQ as the host sees it: on the loopback address.
      NDM_BROKER_URL: amqp://ndm:${NDM_BROKER_PASSWORD:?set NDM_BROKER_PASSWORD in .env}@127.0.0.1:5672/
      NDM_EGRESS_ADDRESS: ${NDM_EGRESS_ADDRESS:-}
      NDM_SOURCE_PORT_RANGE: ${NDM_SOURCE_PORT_RANGE:-61000-61999}
      <<: *scan-settings
    depends_on:
      rabbitmq:
        condition: service_healthy
      scanner-netinit:
        condition: service_completed_successfully
    # As for the orchestrator: SIGTERM ends the scanner at once.
    init: true
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # The scanner has no listening port. It touches this file with every heartbeat.
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/ndm-scanner.heartbeat') > 30)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 2.0

  # One-shot: installs two firewall rules on the host that keep the scanner's
  # probes out of connection tracking, then exits (architecture section 8.5).
  # It changes host firewall rules, which is why it has NET_ADMIN on the host
  # network. Set NDM_NETINIT_SKIP=true to apply the rules by hand instead; see
  # scanner-netinit/README.md.
  scanner-netinit:
    build:
      context: ./scanner-netinit
      args: *version-args
    image: ndm-scanner-netinit:${NDM_VERSION:-1.0.0-rc.1}
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      NDM_SCANNER_SOURCE_PORTS: ${NDM_SOURCE_PORT_RANGE:-61000-61999}
      NDM_NETINIT_SKIP: ${NDM_NETINIT_SKIP:-false}
      NDM_IPTABLES: ${NDM_IPTABLES:-iptables}
    read_only: true
    tmpfs:
      # iptables keeps its lock file here.
      - /run
    restart: "no"
    mem_limit: 64m
    cpus: 0.5

  rabbitmq:
    <<: *hardening
    image: rabbitmq:4.3.7-alpine
    # A fixed name: the broker keeps its data under its node name.
    hostname: rabbitmq
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ndm
      RABBITMQ_DEFAULT_PASS: ${NDM_BROKER_PASSWORD:?set NDM_BROKER_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      # The host's loopback address only: reachable by the scanner, not from outside.
      - "127.0.0.1:5672:5672"
    networks:
      - internal
      - broker-host
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    cpus: 1.0

  # One-shot: applies the schema migrations as the owning role, then exits.
  # The api starts only after it has succeeded. It has no health check because
  # it does not keep running; its exit status is what the api waits for.
  migrate:
    <<: *hardening
    image: ndm-backend:${NDM_VERSION:-1.0.0-rc.1}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args: *version-args
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      NDM_MIGRATION_DATABASE_URL: postgresql+asyncpg://${NDM_DB_OWNER:-ndm_owner}:${NDM_DB_OWNER_PASSWORD:?set NDM_DB_OWNER_PASSWORD in .env}@postgres:5432/ndm
      NDM_APP_DB_ROLE: ${NDM_DB_APP_ROLE:-ndm_app}
      NDM_LOG_LEVEL: ${NDM_LOG_LEVEL:-INFO}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 1.0

  postgres:
    <<: *hardening
    # The same pinned image as the integration tests (backend/tests/integration/conftest.py).
    image: postgis/postgis:17-3.5
    # The image's own non-root user. The data volume is created with its ownership.
    user: postgres
    environment:
      POSTGRES_USER: ${NDM_DB_OWNER:-ndm_owner}
      POSTGRES_PASSWORD: ${NDM_DB_OWNER_PASSWORD:?set NDM_DB_OWNER_PASSWORD in .env}
      POSTGRES_DB: ndm
      # Read by postgres/init-roles.sh when the data volume is first initialized.
      NDM_APP_DB_ROLE: ${NDM_DB_APP_ROLE:-ndm_app}
      NDM_APP_DB_PASSWORD: ${NDM_DB_APP_PASSWORD:?set NDM_DB_APP_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Replaces the image's script, which installs extensions the product does not use.
      - ./postgres/no-postgis-init.sh:/docker-entrypoint-initdb.d/10_postgis.sh:ro
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/20-init-roles.sh:ro
    # No "ports": PostgreSQL is reachable on the internal network only.
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    shm_size: 256m
    mem_limit: 1g
    cpus: 2.0

networks:
  # The proxy's way out to the published port.
  edge: {}
  # No route to or from the outside.
  internal:
    internal: true
  # Lets RabbitMQ publish its port on the host's loopback address.
  broker-host: {}
  # The orchestrator's way out: dataset downloads and reverse DNS. Nothing
  # listens on it, and no port is published from it.
  egress: {}

volumes:
  postgres-data: {}
  rabbitmq-data: {}
  caddy-state: {}
  reference-data: {}
