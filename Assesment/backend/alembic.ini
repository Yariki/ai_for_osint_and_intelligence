# Alembic configuration.
#
# The database URL is not here: migrations/env.py reads it from
# NDM_MIGRATION_DATABASE_URL, so no secret is kept in a file.
# Logging is set up in env.py too (JSON, secrets redacted).

[alembic]
# Package form, so migrations are found wherever the ndm package is installed.
script_location = ndm.db:migrations
