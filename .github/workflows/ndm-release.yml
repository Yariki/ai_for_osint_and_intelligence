# Release of Network Discovery Map (Assesment/): on a tag ndm-v<release>, run
# every CI stage on the tagged commit, then build the release images with the
# same script an operator uses (deploy/release/build-images.sh) and keep them,
# with their digests, as an artifact of the run.
name: ndm-release

on:
  push:
    tags:
      - "ndm-v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ndm-ci.yml

  images:
    needs: ci
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Assesment
    steps:
      - uses: actions/checkout@v7

      # The tag and VERSIONS.md must name the same release.
      - name: Release
        id: release
        run: |
          release="${GITHUB_REF_NAME#ndm-v}"
          grep -q "^Release: \`$release\`$" deploy/release/VERSIONS.md
          echo "version=$release" >> "$GITHUB_OUTPUT"

      - name: Build the images
        run: deploy/release/build-images.sh "${{ steps.release.outputs.version }}"

      - name: Save the images
        run: |
          release="${{ steps.release.outputs.version }}"
          images="ndm-backend:$release ndm-scanner:$release ndm-proxy:$release ndm-scanner-netinit:$release"
          images="$images $(sed -n 's/^ *image: *\([^ ]*\) *$/\1/p' deploy/compose.yaml | grep -v '^ndm-' | sort -u | tr '\n' ' ')"
          docker save $images | gzip > "$RUNNER_TEMP/ndm-images-$release.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: ndm-release-${{ steps.release.outputs.version }}
          path: |
            ${{ runner.temp }}/ndm-images-${{ steps.release.outputs.version }}.tar.gz
            Assesment/deploy/release/digests-${{ steps.release.outputs.version }}.txt
          retention-days: 90
