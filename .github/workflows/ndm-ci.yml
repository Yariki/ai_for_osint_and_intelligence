# CI for Network Discovery Map (Assesment/).
#
# The seven stages of delivery plan section 2.2, item 1:
# ruff, mypy, vue-tsc, ESLint, unit tests, integration tests, dependency scan.
name: ndm-ci

on:
  push:
    paths:
      - "Assesment/**"
      - ".github/workflows/ndm-ci.yml"
  pull_request:
    paths:
      - "Assesment/**"
      - ".github/workflows/ndm-ci.yml"
  # The release workflow runs these stages on the tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Assesment/backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          enable-cache: true

      # --locked fails when uv.lock does not match pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      # C-3: the scanner and the core it imports must not use the database or
      # the web layer. Part of the ruff stage above; shown as its own step so a
      # violation is named for what it is.
      - name: Import rule (C-3)
        run: uv run --no-sync ruff check --select TID251 src/ndm/scanner src/ndm/core

      - name: mypy
        run: uv run --no-sync mypy

      - name: Unit tests
        run: uv run --no-sync pytest tests/unit

      # Integration tests start PostgreSQL and RabbitMQ through testcontainers and need Docker,
      # which the runner provides. The directory arrives with the first
      # integration test; from then on this stage fails like any other.
      - name: Integration tests
        run: |
          if [ -d tests/integration ]; then
            uv run --no-sync pytest tests/integration
          else
            echo "No integration tests yet."
          fi

      - name: Dependency scan
        run: |
          uv export --locked --all-extras --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uv run --no-sync pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Assesment/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Assesment/frontend/package-lock.json

      # npm ci fails when package-lock.json does not match package.json.
      - name: Install dependencies
        run: npm ci

      - name: vue-tsc
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Dependency scan
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
