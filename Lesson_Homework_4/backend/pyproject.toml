[project]
name = "respectful-rss-reader"
version = "0.1.0"
description = "Incremental, scheduled RSS reader with a single-user dashboard"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.17,<2",
  "celery[redis]>=5.6.3,<5.7",
  "fastapi>=0.119,<1",
  "feedparser>=6.0.12,<7",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.11,<3",
  "protego>=0.5,<1",
  "sqlalchemy>=2.0.44,<2.1",
  "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1", "pyright>=1.1.407,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_reader"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
